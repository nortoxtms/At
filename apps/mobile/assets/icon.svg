<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    ONLY HORSES app icon — a cream horse on the brand brown.

    The source of truth for every raster in this directory; scripts/icons.mjs
    renders them. Editing a PNG by hand means the six sizes drift apart, which
    is how an app ends up with one icon on the home screen and another in the
    app switcher.

    Colours are §20.1's: `surfaceRaised` down to `bg` for the ground,
    `textPrimary` for the horse, `goldMuted` for the ring. Choosing a new brown
    would put a sixth colour into a palette that has exactly one accent.

    A head and neck in profile, not a whole horse. At 48 px — a home screen, a
    tab bar, a favicon — a full body is a smudge; the head is the only
    silhouette of a horse that survives being small.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B241C"/>
      <stop offset="100%" stop-color="#17140F"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#ground)"/>
  <circle cx="512" cy="512" r="400" fill="none" stroke="#8F7645" stroke-width="9" opacity="0.5"/>

  <!--
    Scaled and centred inside the ring.
    
    Drawn full-bleed and fitted here rather than by moving every control point:
    the path's own coordinates stay readable, and the mark cannot drift out of
    the circle when a curve is tweaked. Its natural box is roughly
    488 × 634 centred on (562, 495).
  -->
  <g fill="#F4EFE6" transform="translate(512 512) scale(0.78) translate(-558 -500)">
    <!--
      Ears first, so the poll below them can overlap cleanly. Two of them, at
      slightly different angles — a horse with symmetrical ears looks stamped.
    -->
    <path d="M 552 344 C 546 264, 552 214, 570 178 C 594 214, 608 262, 612 340 Z"/>
    <!-- Base carried well down into the crest; ending it at the outline left a
         dark wedge where the two shapes almost, but not quite, met. -->
    <path d="M 628 404 C 642 300, 664 222, 692 196 C 702 250, 698 322, 678 404 Z"/>

    <!--
      Head and neck as one closed path, read clockwise from the poll:
      forehead → down the face → muzzle → under the jaw → throat → the front of
      the neck → across the base → up the crest → back to the poll.
    -->
    <path d="
      M 596 292
      C 540 300, 486 330, 442 378
      C 398 426, 362 484, 336 546
      C 322 580, 314 612, 318 640
      C 322 664, 340 678, 366 676
      C 388 674, 408 662, 428 650
      C 452 636, 478 628, 506 632
      C 542 638, 574 660, 600 690
      C 630 724, 652 766, 666 812
      L 806 812
      C 802 726, 790 640, 766 558
      C 742 476, 704 400, 650 340
      C 634 322, 616 306, 596 292
      Z"/>

    <!--
      Inside the group, or it does not move with the horse: sitting outside the
      transform it stayed at its full-bleed coordinates and landed on the crest,
      which read as a notch cut out of the neck.
    -->
    <ellipse cx="524" cy="404" rx="17" ry="21" fill="#17140F"/>
  </g>
</svg>
