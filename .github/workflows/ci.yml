name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # §24.24: no secrets in the repository. This runs first and independently so
  # a leaked key fails the build even if everything else is broken.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # §24: "migrations reproducible from scratch", §24.23 RLS cross-tenant test.
  database:
    name: Database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: only_horses
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Migrate from scratch and run the SQL suites
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/only_horses
          DATABASE_URL: postgresql://only_horses_app@localhost:5432/only_horses
          PGPASSWORD: postgres
        run: pnpm test:db

  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # §24.8 verifies EXIF GPS removal with exiftool; without the binary that
      # assertion degrades to a no-op.
      - name: Install exiftool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The static export is a second build target with its own failure modes,
      # and it broke twice without anyone noticing: once because a custom
      # distDir moved where Next writes the export, once because the signed-in
      # routes cannot be exported at all. Both times `pnpm build` was green,
      # the Pages workflow went red on its own, and the published site quietly
      # stayed several commits behind while looking fine.
      #
      # Running it here means a change that breaks the export fails the same
      # check as a change that breaks the app, instead of failing somewhere
      # nobody is looking.
      - name: Static export (the GitHub Pages target)
        run: PAGES_BASE_PATH=/At bash scripts/build-preview.sh

      - name: The export must contain the pages it claims to
        run: |
          for page in index.html tr/atlar/index.html tr/fiyatlandirma/index.html \
                      tr/kosullar/index.html tr/ilan-ver/index.html; do
            test -f "apps/web/out/$page" || { echo "missing $page"; exit 1; }
          done
          # A listing detail page proves the demo dataset still renders through
          # the real page rather than erroring into an empty file.
          ls apps/web/out/tr/atlar/*/index.html >/dev/null
