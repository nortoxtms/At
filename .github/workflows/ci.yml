name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # §24.24: no secrets in the repository. This runs first and independently so
  # a leaked key fails the build even if everything else is broken.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # §24: "migrations reproducible from scratch", §24.23 RLS cross-tenant test.
  database:
    name: Database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: only_horses
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Migrate from scratch and run the SQL suites
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/only_horses
          DATABASE_URL: postgresql://only_horses_app@localhost:5432/only_horses
          PGPASSWORD: postgres
        run: pnpm test:db

  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # §24.8 verifies EXIF GPS removal with exiftool; without the binary that
      # assertion degrades to a no-op.
      - name: Install exiftool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The static export is a second build target with its own failure modes,
      # and it broke twice without anyone noticing: once because a custom
      # distDir moved where Next writes the export, once because the signed-in
      # routes cannot be exported at all. Both times `pnpm build` was green,
      # the Pages workflow went red on its own, and the published site quietly
      # stayed several commits behind while looking fine.
      #
      # Running it here means a change that breaks the export fails the same
      # check as a change that breaks the app, instead of failing somewhere
      # nobody is looking.
      - name: Static export (the GitHub Pages target)
        run: PAGES_BASE_PATH=/At bash scripts/build-preview.sh

      - name: The export must contain the pages it claims to
        run: |
          for page in index.html tr/atlar/index.html tr/fiyatlandirma/index.html \
                      tr/kosullar/index.html tr/ilan-ver/index.html; do
            test -f "apps/web/out/$page" || { echo "missing $page"; exit 1; }
          done
          # A listing detail page proves the demo dataset still renders through
          # the real page rather than erroring into an empty file.
          ls apps/web/out/tr/atlar/*/index.html >/dev/null
          # The equipment marketplace is the other half of §13 and exports the
          # same way; a page missing here means a filter route silently stopped
          # being exportable.
          ls apps/web/out/tr/urunler/*/index.html >/dev/null
          ls apps/web/out/tr/profil/*/index.html >/dev/null

  # The web app, against a real API.
  #
  # `pnpm build` proves it compiles, and the static export proves the public
  # pages render on committed data. Neither touches the signed-in half — the
  # cookie session, the server actions, the RLS-scoped reads — and neither
  # would notice a page that answers 500 the moment it has to ask the API a
  # question. So this stands the whole stack up and walks every route.
  web:
    name: Web (against a live API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: only_horses
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/only_horses
      DATABASE_URL: postgresql://only_horses_app@localhost:5432/only_horses
      DB_URL: postgresql://postgres:postgres@localhost:5432/only_horses
      PGPASSWORD: postgres
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # Not a secret: a throwaway signing key for a database that exists for
      # the length of this job. Nothing signed with it leaves the runner.
      JWT_SECRET: ci-only-throwaway-signing-key-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm --filter @only-horses/shared-types build
      - run: pnpm --filter @only-horses/demo-content build
      # `--seed` loads §7's reference tables. Without them there are no breeds
      # and no product categories, and half the forms render an empty select.
      - name: Migrate and seed the reference data
        run: node scripts/migrate.mjs --seed

      - name: Build and start the API
        run: |
          pnpm --filter @only-horses/api build
          pnpm --filter @only-horses/api start &
          npx --yes wait-on http://localhost:3001/v1/reference/breeds --timeout 90000

      - name: Build and start the web app
        run: |
          pnpm --filter @only-horses/web build
          # `output: 'standalone'` writes a server but not the assets it
          # serves — .next/static has to be copied in beside it, or every page
          # renders unstyled and every check that reads a colour is measuring
          # the wrong thing. (There is no public/ in this app.)
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          node apps/web/.next/standalone/apps/web/server.js &
          npx --yes wait-on http://localhost:3000/tr/atlar --timeout 90000

      - name: Install Chromium for Playwright
        run: npx --yes playwright@1.49.1 install --with-deps chromium

      # The signed-in journey: register in the browser, record a horse, add to
      # its history, list it, sell a saddle beside it, answer a message. This
      # is the only check that holds a session at all.
      - name: The authenticated journey
        run: node scripts/web-account.mjs

      # Every route, rendered. A 500 from a page that only fails once it has
      # data is invisible to every other job here.
      - name: Every route renders
        run: node scripts/web-shot.mjs artifacts/web-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-shots
          path: artifacts/web-shots
          if-no-files-found: ignore

  # The mobile app is the half of the product that cannot be run here — no
  # simulator, no device. What it does have is Expo's web target: the same
  # React tree, the same components, the same tokens, rendered by
  # react-native-web. That is not proof the native build works and is not
  # claimed to be. What it catches is what actually breaks most of the time —
  # a screen that throws, a route that does not resolve, text the same colour
  # as its background, a layout that overflows a 390 pt viewport.
  mobile:
    name: Mobile (Expo web export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @only-horses/shared-types build
      - run: pnpm --filter @only-horses/demo-content build
      - run: pnpm --filter @only-horses/mobile typecheck

      # A bundle that fails to build is the failure this catches first; the
      # app typechecks happily with a route that Metro cannot resolve.
      - name: Export the app for web
        working-directory: apps/mobile
        run: npx expo export --platform web

      - name: Install Chromium for Playwright
        run: npx --yes playwright@1.49.1 install --with-deps chromium

      - name: Serve the export
        run: npx --yes serve -s -l 4400 apps/mobile/dist &

      - name: Every screen renders, and none of them logs an error
        run: |
          npx --yes wait-on http://localhost:4400 --timeout 60000
          node scripts/mobile-shot.mjs http://localhost:4400/ \
            / /onboarding /auth /auth/rol /auth/parola /ara /filtreler \
            /ahir /ahir/yeni /ilan-ver /ilanlarim /kaydedilenler /aramalarim \
            /bildirimler /hizmetler /isler /uzmanlar /planlar /hakkinda \
            /dogrulama /ayarlar /bildir /mesajlar /profil /demo \
            /urunler /urunler/yeni /urunlerim

      # The demo, with the API not merely absent but unreachable — every
      # request to it is aborted, and any attempt fails the run. This is the
      # check that keeps demo mode honest: a screen that quietly falls back to
      # the network fails here rather than in front of someone.
      - name: The demo works with no server
        run: node scripts/mobile-demo-e2e.mjs http://localhost:4400

      # §18.3's floor, measured rather than asserted. AUDIT_SETTLE_MS is not
      # optional here: a client-rendered app's first frame is a splash screen
      # on a black ground, and auditing that passes everything.
      - name: WCAG AA, on every screen
        env:
          AUDIT_SETTLE_MS: '2500'
        run: |
          node scripts/contrast-audit.mjs \
            http://localhost:4400/ http://localhost:4400/ara \
            http://localhost:4400/onboarding http://localhost:4400/auth \
            http://localhost:4400/auth/rol http://localhost:4400/filtreler \
            http://localhost:4400/ahir http://localhost:4400/ahir/yeni \
            http://localhost:4400/ilan-ver http://localhost:4400/ilanlarim \
            http://localhost:4400/kaydedilenler http://localhost:4400/aramalarim \
            http://localhost:4400/bildirimler http://localhost:4400/hizmetler \
            http://localhost:4400/isler http://localhost:4400/uzmanlar \
            http://localhost:4400/planlar http://localhost:4400/hakkinda \
            http://localhost:4400/dogrulama http://localhost:4400/ayarlar \
            http://localhost:4400/bildir http://localhost:4400/mesajlar \
            http://localhost:4400/profil http://localhost:4400/demo \
            http://localhost:4400/urunler http://localhost:4400/urunler/yeni \
            http://localhost:4400/urunlerim
